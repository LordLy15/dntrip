name: Build and Deploy to Vercel (Frontend) & Railway (Backend)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Frontend - Flutter Web to Vercel
  frontend-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd frontend
          flutter build web

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend/build/web

  # Backend - Laravel to Railway
  # Note: Railway deployment is triggered automatically via GitHub integration
  # Configure Railway at: https://railway.app/dashboard
  # Steps:
  # 1. Connect GitHub repo to Railway
  # 2. Railway auto-detects Laravel from railway.toml
  # 3. Set environment variables in Railway dashboard
