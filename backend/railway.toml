[railway]
  plugin = "node"

[build]
  command = "composer install --no-dev"
  builder = "nixpacks"

[deploy]
  numInstances = 1
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
  startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"

[environments]
  [environments.production]
    variables = []
