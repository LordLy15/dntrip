[railway]
  plugin = "nixpacks"

[nixpacks]
  php_version = 8.2

[build]
  command = "composer install --no-dev --optimize-autoloader"
  builder = "nixpacks"

[deploy]
  numInstances = 1
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
  startCommand = "php artisan serve --host=0.0.0.0 --port=${PORT}"
